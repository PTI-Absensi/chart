<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Directly-Folows Graph (DFG)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/static/css/styles.css" />
    <style>
      :root {
        --bg-1: #f3efe7;
        --bg-2: #e7f1ee;
        --card: #ffffff;
        --stroke: rgba(20, 32, 25, 0.12);
        --text: #142019;
        --muted: #5b6b63;
        --accent: #0f766e;
        --accent-2: #2a9d8f;
        --accent-3: #e76f51;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(130deg, var(--bg-1), var(--bg-2));
        min-height: 100vh;
      }

      .page-content {
        width: min(1400px, 100%);
        margin: 0 auto;
        padding: 36px 0 60px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
      }

      .title-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(28px, 4vw, 38px);
        letter-spacing: 0.5px;
      }

      h2 {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(16px, 2.2vw, 20px);
        color: var(--muted);
        font-weight: 500;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(55, 201, 183, 0.12);
        border: 1px solid rgba(55, 201, 183, 0.3);
        color: var(--accent-2);
        font-size: 13px;
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 40px rgba(15, 46, 35, 0.12);
        backdrop-filter: none;
        animation: fadeUp 0.6s ease forwards;
        opacity: 0;
      }

      .card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .card:nth-child(2) {
        animation-delay: 0.2s;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card h3 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 14px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
      }

      input,
      select,
      textarea,
      button {
        font-family: inherit;
        color: var(--text);
      }

      input,
      select,
      textarea {
        background: #ffffff;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid rgba(100, 181, 246, 0.4);
        border-color: rgba(100, 181, 246, 0.6);
      }

      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
      }

      .btn-secondary {
        background: rgba(42, 157, 143, 0.12);
        border: 1px solid rgba(42, 157, 143, 0.35);
        color: var(--accent-2);
      }

      .btn-ghost {
        background: rgba(231, 111, 81, 0.12);
        border: 1px solid rgba(231, 111, 81, 0.35);
        color: var(--accent-3);
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }

      .tab {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      .tab.active {
        border-color: rgba(240, 180, 76, 0.5);
        color: var(--text);
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: block;
      }

      .preview-box {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 12px;
        min-height: 420px;
        background: rgba(8, 12, 20, 0.5);
        overflow-x: auto;
      }

      .preview-box img {
        width: 100%;
        height: auto;
        max-height: 520px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }

      .mermaid-output {
        background: #ffffff;
        color: #111827;
        border-radius: 10px;
        padding: 10px;
        overflow-x: auto;
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }

      @media (max-width: 960px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="top-nav">
        <div class="nav-brand">Procurement Apps</div>
        <div class="nav-links">
          <a class="nav-link" href="/dashboard">Chart</a>
          <a class="nav-link is-active" href="/dashboard/dfg">DFG</a>
          <a class="nav-link" href="/dashboard/process-time">Process Time</a>
        </div>
      </nav>
      <div class="page-content">
        <header>
        <div class="title-wrap">
          <h1>Directly-Folows Graph (DFG)</h1>
          <h2>Manajemen Pengadaan</h2>
        </div>
        <div class="pill">Event-based DFG</div>
        </header>

        <div class="grid">
        <section class="card">
          <h3>Create DFG</h3>
          <div class="field">
            <label for="table">Event log table</label>
            <input id="table" type="text" value="fact_event_log_v2" />
          </div>
          <div class="row">
            <div class="field">
              <label for="mode">Mode</label>
              <select id="mode">
                <option value="event">event</option>
                <option value="status">status</option>
              </select>
            </div>
            <div class="field">
              <label for="format">Output format</label>
              <select id="format">
                <option value="png">png</option>
                <option value="svg">svg</option>
                <option value="dot">dot</option>
                <option value="csv">csv</option>
              </select>
            </div>
            <div class="field">
              <label for="minEdge">Min edge</label>
              <input id="minEdge" type="number" min="1" value="1" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="tahunAnggaran">Tahun anggaran</label>
              <input id="tahunAnggaran" type="text" placeholder="2025" />
            </div>
            <div class="field">
              <label for="sumberDana">Sumber dana</label>
              <input id="sumberDana" type="text" placeholder="eksploitasi" />
            </div>
            <div class="field">
              <label for="kategoriPlant">Kategori plant</label>
              <input id="kategoriPlant" type="text" placeholder="PG" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="startDate">Start date</label>
              <input id="startDate" type="date" />
            </div>
            <div class="field">
              <label for="endDate">End date</label>
              <input id="endDate" type="date" />
            </div>
          </div>

          <div class="button-row">
            <button class="btn-ghost" id="loadLatest">Load latest file</button>
          </div>
        </section>

        <section class="card">
          <h3>DFG Preview</h3>
          <div class="tabs">
            <button class="tab active" data-tab="image">Image</button>
            <button class="tab" data-tab="mermaid">Mermaid</button>
          </div>

          <div class="panel active" id="panel-image">
            <div class="field">
              <label for="imageInput">Load image file</label>
              <input id="imageInput" type="file" accept="image/png,image/svg+xml" />
            </div>
            <div class="preview-box">
              <img id="imagePreview" alt="DFG preview" />
            </div>
          </div>

          <div class="panel" id="panel-mermaid">
            <div class="field">
              <label for="mermaidInput">Mermaid source</label>
              <textarea
                id="mermaidInput"
                rows="9"
              >graph LR
  Start((Start)) -->|9360| PR_VERIFIED
  PR_VERIFIED -->|9217| PK_START
  PR_VERIFIED -->|26| PK_SUBMIT_HPS
  PK_START -->|8990| PK_SUBMIT_HPS
  PK_START -->|209| HPS_FINISH
  PK_SUBMIT_HPS -->|8907| HPS_FINISH
  PK_SUBMIT_HPS -->|209| PK_FINISH
  HPS_FINISH -->|8907| PK_FINISH
  PK_FINISH -->|9075| PP_START
  PP_START -->|9075| PP_PELAKSANAAN
  PP_PELAKSANAAN -->|9094| PP_TAYANG
  PP_TAYANG -->|8902| PP_PEMENANG
  PP_PEMENANG -->|8902| SPPBJ_START
  SPPBJ_START -->|8902| SPPBJ_FINISH["SPPBJ Finish/PP Selesai"]
  SPPBJ_FINISH -->|8902| End((End))</textarea
              >
            </div>
            <div class="button-row">
              <button class="btn-primary" id="renderMermaid">Render Mermaid</button>
            </div>
            <div class="preview-box mermaid-output" id="mermaidPreview">
              Mermaid preview will appear here.
            </div>
            <div class="note">
              Mermaid rendering uses CDN. If offline, copy the text to a Mermaid editor.
            </div>
          </div>
        </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      const formatEl = document.getElementById("format");
      const modeEl = document.getElementById("mode");
      const tableEl = document.getElementById("table");
      const minEdgeEl = document.getElementById("minEdge");
      const tahunEl = document.getElementById("tahunAnggaran");
      const sumberEl = document.getElementById("sumberDana");
      const kategoriEl = document.getElementById("kategoriPlant");
      const startEl = document.getElementById("startDate");
      const endEl = document.getElementById("endDate");

      function buildCommand() {
        const format = formatEl.value;
        const mode = modeEl.value;
        const table = tableEl.value.trim() || "fact_event_log_v2";
        const minEdge = minEdgeEl.value || "1";
        const baseName = table.includes("v2") ? "dfg_v2" : "dfg";
        const output = `dfg_module/out/${baseName}.${format}`;
        const previewPath = output.startsWith("dfg_module/")
          ? output.replace("dfg_module/", "")
          : output;

        let cmd = `python dfg_module/dfg_cli.py --output ${output} --format ${format} --mode ${mode} --table ${table} --min-edge ${minEdge}`;

        if (tahunEl.value.trim()) cmd += ` --tahun-anggaran ${tahunEl.value.trim()}`;
        if (sumberEl.value.trim()) cmd += ` --sumber-dana ${sumberEl.value.trim()}`;
        if (kategoriEl.value.trim()) cmd += ` --kategori-plant ${kategoriEl.value.trim()}`;
        if (startEl.value) cmd += ` --start-date ${startEl.value}`;
        if (endEl.value) cmd += ` --end-date ${endEl.value}`;

        return previewPath;
      }

      document.getElementById("loadLatest").addEventListener("click", () => {
        const output = buildCommand();
        const img = document.getElementById("imagePreview");
        img.src = output + `?t=${Date.now()}`;
      });

      formatEl.addEventListener("change", buildCommand);
      modeEl.addEventListener("change", buildCommand);
      tableEl.addEventListener("input", buildCommand);
      minEdgeEl.addEventListener("input", buildCommand);
      tahunEl.addEventListener("input", buildCommand);
      sumberEl.addEventListener("input", buildCommand);
      kategoriEl.addEventListener("input", buildCommand);
      startEl.addEventListener("change", buildCommand);
      endEl.addEventListener("change", buildCommand);

      const initialPreview = buildCommand();
      document.getElementById("imagePreview").src =
        initialPreview + `?t=${Date.now()}`;

      const tabs = document.querySelectorAll(".tab");
      const panels = {
        image: document.getElementById("panel-image"),
        mermaid: document.getElementById("panel-mermaid"),
      };
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          Object.values(panels).forEach((p) => p.classList.remove("active"));
          panels[tab.dataset.tab].classList.add("active");
        });
      });

      const imageInput = document.getElementById("imageInput");
      const imagePreview = document.getElementById("imagePreview");
      imageInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      const mermaidPreview = document.getElementById("mermaidPreview");
      const mermaidInput = document.getElementById("mermaidInput");
      const renderMermaid = async () => {
        const code = mermaidInput.value.trim();
        if (!code) return;
        if (!window.mermaid) {
          mermaidPreview.textContent = "Mermaid CDN not loaded.";
          return;
        }
        mermaid.initialize({ startOnLoad: false, theme: "base" });
        try {
          const id = `dfgSvg${Date.now()}`;
          const { svg } = await mermaid.render(id, code);
          mermaidPreview.innerHTML = svg;
        } catch (err) {
          mermaidPreview.textContent = "Failed to render Mermaid.";
        }
      };

      document.getElementById("renderMermaid").addEventListener("click", renderMermaid);
      renderMermaid();
    </script>
  </body>
</html>
